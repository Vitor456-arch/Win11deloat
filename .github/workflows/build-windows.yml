name: Build unsigned Windows development artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]" "pyinstaller>=6.11,<7"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name ClearWindows packaging/launcher.py
      - name: Include product and third-party notices
        shell: pwsh
        run: |
          Copy-Item README.md,LICENSE,THIRD-PARTY.md dist/ClearWindows/
          Copy-Item docs dist/ClearWindows/ -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: ClearWindows-unsigned-development
          path: dist/ClearWindows/
